<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/assets/img/Logo-DDC.png">
  <title>Kho Phôi Cuộn - DDC</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/js/pwa-register.js" defer></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #3b82f6, #1d4ed8);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #8b5cf6, #6d28d9);
      bottom: -150px;
      right: -150px;
      animation-delay: -3s;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      100% { transform: scale(1.15) translate(20px, 20px); opacity: 0.45; }
    }

    /* Splash Container Card */
    .splash-card {
      position: relative;
      z-index: 10;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem 3rem;
      width: 420px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(59, 130, 246, 0.15);
    }

    .logo-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      animation: logoFloat 3s ease-in-out infinite alternate;
    }

    .logo-box img {
      max-width: 54px;
      max-height: 54px;
      object-fit: contain;
    }

    @keyframes logoFloat {
      0% { transform: translateY(0); box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
      100% { transform: translateY(-6px); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4); }
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 0.3rem;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
      font-weight: 400;
    }

    /* Progress Bar */
    .progress-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 1rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      border-radius: 999px;
      transition: width 0.3s ease;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-text {
      font-size: 0.82rem;
      color: #38bdf8;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-msg {
      transition: opacity 0.2s ease;
    }

    .status-percent {
      color: #94a3b8;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="splash-card">
    <div class="logo-box">
      <img src="/assets/img/Logo-DDC.png" alt="DDC Logo" onerror="this.onerror=null; this.src='/assets/images/icon-512.png';">
    </div>
    <div class="app-title">Kho Phôi Cuộn - DDC</div>
    <div class="app-subtitle">Hệ thống Quản lý Kho Phôi Cuộn System</div>

    <div class="progress-container">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status-text">
      <span class="status-msg" id="statusMsg">Đang nạp ứng dụng...</span>
      <span class="status-percent" id="statusPercent">0%</span>
    </div>
  </div>

  <script>
    (function() {
      const fill = document.getElementById('progressFill');
      const msg = document.getElementById('statusMsg');
      const percent = document.getElementById('statusPercent');

      const steps = [
        { p: 25, t: 'Đang khởi tạo hệ thống...' },
        { p: 60, t: 'Kiểm tra kết nối dữ liệu...' },
        { p: 90, t: 'Đang mở giao diện...' },
        { p: 100, t: 'Sẵn sàng!' }
      ];

      let stepIdx = 0;

      function updateProgress() {
        if (stepIdx < steps.length) {
          const step = steps[stepIdx];
          fill.style.width = step.p + '%';
          msg.textContent = step.t;
          percent.textContent = step.p + '%';
          stepIdx++;

          if (step.p === 100) {
            setTimeout(() => {
              window.location.href = '/pages/index.html';
            }, 300);
          } else {
            setTimeout(updateProgress, 220);
          }
        }
      }

      setTimeout(updateProgress, 80);
    })();
  </script>
</body>
</html>
