<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Test Receipt OCR Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h3>Kiểm tra ReceiptOcrService</h3>
    <div id="testResults" class="mt-3"></div>
  </div>

  <script src="/assets/js/core/receipt-ocr-service.js"></script>
  <script>
    const results = document.getElementById('testResults');
    function log(name, passed, msg = '') {
      const div = document.createElement('div');
      div.className = `alert alert-${passed ? 'success' : 'danger'} py-2 mb-2`;
      div.innerHTML = `<strong>${passed ? 'PASS' : 'FAIL'}:</strong> ${name} ${msg ? `(${msg})` : ''}`;
      results.appendChild(div);
    }

    try {
      // Test 1: Service defined
      log('ReceiptOcrService is defined', typeof window.ReceiptOcrService === 'object');

      // Test 2: normalizeDate
      const d1 = window.ReceiptOcrService.normalizeDate('31/08/2026');
      log('normalizeDate 31/08/2026 -> 2026-08-31', d1 === '2026-08-31', d1);

      const d2 = window.ReceiptOcrService.normalizeDate('2026-08-31');
      log('normalizeDate 2026-08-31 -> 2026-08-31', d2 === '2026-08-31', d2);

      // Test 3: API Key management
      window.ReceiptOcrService.setApiKey('test_api_key_1234567890');
      log('setApiKey & getApiKey', window.ReceiptOcrService.getApiKey() === 'test_api_key_1234567890');
      log('hasApiKey()', window.ReceiptOcrService.hasApiKey() === true);

      window.ReceiptOcrService.setApiKey('');
      log('clearApiKey', window.ReceiptOcrService.getApiKey() === '');
      log('hasApiKey() after clear', window.ReceiptOcrService.hasApiKey() === false);

    } catch (e) {
      log('Execution Error', false, e.message);
    }
  </script>
</body>
</html>
