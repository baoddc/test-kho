<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho Grating - Tồn</title>

  <!-- Logo hiển thị trên tab -->
  <link rel="icon" type="image/png" href="/assets/images/logos/Logo-DDC.png">

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <!-- Sidebar CSS -->
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/trang-chu/home.css">
  <link rel="stylesheet" href="/assets/css/xg/xg-ton.css">
</head>

<body class="fixed-viewport">

  <!-- ==================== MAIN CONTENT ==================== -->
  <div class="container-fluid main-content">

    <div class="row">
      <!-- Data Table Column - Full Width -->
      <div class="col-12">
        <!-- Title Row -->
        <div class="d-flex align-items-center mb-2">
          <div class="me-auto">
            <h5 class="mb-0 text-primary fw-bold">Dữ liệu Tồn grating</h5>
            <div class="small text-muted">Tồn theo Mã vật tư + Batch = tổng nhập − tổng xuất. "Ngày nhập" là ngày của lô cũ nhất còn tồn.</div>
          </div>
        </div>

        <!-- Search and Actions Row -->
        <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
          <div class="flex-grow-1">
            <input type="text" id="searchInput" class="form-control form-control-sm"
              placeholder="Tìm Mã vật tư, Tên vật tư, Batch hoặc Vị trí...">
          </div>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="showEmptyToggle">
            <label class="form-check-label small" for="showEmptyToggle">Hiện cả mã đã hết tồn</label>
          </div>
          <div>
            <button id="btnScanQR" class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1" title="Quét mã QR kệ">
              <i class="bi bi-qr-code-scan"></i> Quét Kệ
            </button>
          </div>
          <div>
            <button id="btnResetFilter" class="btn btn-secondary btn-sm">Reset</button>
          </div>
          <div>
            <button id="btnExport" class="btn btn-success btn-sm" disabled>
              Tải file Excel (.xlsx)
            </button>
          </div>
        </div>

        <!-- Loading indicator -->
        <div id="loading">Đang tải dữ liệu...</div>

        <!-- Data Table -->
        <div class="table-responsive mt-3">
          <table id="dataTable" class="table table-bordered table-hover">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Pagination Controls -->
        <div class="d-flex align-items-center justify-content-end mb-0 flex-wrap gap-2" style="margin-top: 2px;">
          <!-- Tổng tồn (Kg) theo dữ liệu đang lọc -->
          <div class="qty-summary me-auto" title="Tổng theo toàn bộ dữ liệu đang lọc (tất cả các trang)">
            <i class="bi bi-box-seam"></i>
            <span>Tổng tồn:</span>
            <strong id="totalQtyValue">0</strong><span>kg</span>
            <span class="qty-summary-sep">|</span>
            <span id="totalQtyRows">0</span><span>mã</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="prevPage" class="btn btn-sm btn-outline-secondary">← Trang trước</button>
            <select id="pageSelect" class="form-select form-select-sm" style="width: auto;">
              <!-- Page options will be populated by JavaScript -->
            </select>
            <button id="nextPage" class="btn btn-sm btn-outline-secondary">Trang sau →</button>
          </div>
          <div class="text-muted small ms-3">
            <span id="pageInfo">Trang 1 / 1</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPTS ==================== -->

  <!-- SheetJS (xlsx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- HTML5 QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/assets/js/core/supabase-config.js?v=2.0.4"></script>
  <script src="/assets/js/core/server-query.js?v=3.0.1"></script>
  <script src="/assets/js/core/qr-scanner-service.js?v=2.0.3"></script>

  <!-- Sidebar JS (auto-injects sidebar + topbar) -->
  <script src="/assets/js/components/sidebar.js?v=2.2.1"></script>
  <script src="/assets/js/trang-chu/home.js?v=3.0.1"></script>
  <script src="/assets/js/grating/grating-ton.js?v=1.0.1"></script>

  <!-- Bootstrap JS (for dropdown) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
