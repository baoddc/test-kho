<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tạo & In Tem QR Vị Trí Kệ Kho - Thép Đại Dũng</title>

  <!-- Logo hiển thị trên tab -->
  <link rel="icon" type="image/png" href="/assets/images/logos/Logo-DDC.png">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/in-tem-vitri.css">
</head>

<body class="fixed-viewport">

  <!-- ==================== MAIN CONTENT ==================== -->
  <div class="container-fluid main-content">

    <!-- Header Section (Screen Only) -->
    <div class="d-flex align-items-center justify-content-between mb-3 no-print flex-wrap gap-2">
      <div>
        <h4 class="mb-0 text-primary fw-bold d-flex align-items-center gap-2">
          <i class="bi bi-qr-code-scan"></i> Tạo & In Tem QR Vị Trí Kệ Kho
        </h4>
        <small class="text-muted">Áp dụng chung cho 28 kệ (A01-A14, B01-B14) & Kệ Grating (Kho Xà gồ & Kho Tole)</small>
      </div>
      <div class="d-flex gap-2">
        <button id="btnPrint" class="btn btn-primary fw-bold shadow-sm d-flex align-items-center gap-2">
          <i class="bi bi-printer-fill"></i> In Danh Sách Tem (Ctrl + P)
        </button>
      </div>
    </div>

    <!-- Control Panel (Screen Only) -->
    <div class="card shadow-sm border-0 mb-4 no-print" id="controlPanel">
      <div class="card-body p-3">
        <div class="row g-3">
          
          <!-- Column 1: Warehouse & Format Options -->
          <div class="col-lg-4 col-md-12">
            <h6 class="fw-bold text-dark mb-2"><i class="bi bi-gear-fill text-primary"></i> 1. Cấu hình tem in</h6>
            
            <div class="mb-2">
              <label class="form-label small fw-semibold mb-1">Tiêu đề Kho:</label>
              <select id="warehouseTitleSelect" class="form-select form-select-sm">
                <option value="KHO XÀ GỒ & TOLE - DDC" selected>KHO XÀ GỒ & TOLE - DDC (Dùng chung)</option>
                <option value="KHO XÀ GỒ - ĐẠI DŨNG">KHO XÀ GỒ - ĐẠI DŨNG</option>
                <option value="KHO TOLE - ĐẠI DŨNG">KHO TOLE - ĐẠI DŨNG</option>
                <option value="KHO PHỤ LIỆU - ĐẠI DŨNG">KHO PHỤ LIỆU - ĐẠI DŨNG</option>
                <option value="custom">-- Tự nhập tiêu đề khác --</option>
              </select>
              <input type="text" id="customWarehouseTitle" class="form-control form-control-sm mt-1 d-none" placeholder="Nhập tiêu đề kho...">
            </div>

            <div class="mb-2">
              <label class="form-label small fw-semibold mb-1">Bố cục & Khổ in:</label>
              <select id="layoutSelect" class="form-select form-select-sm">
                <option value="a4-grid-4" selected>Khổ A4 - 4 tem/trang (Chuẩn dán mặt kệ - ~13x9 cm)</option>
                <option value="a4-grid-2">Khổ A4 - 2 tem/trang (Khổ lớn dán đầu dãy - ~18x12 cm)</option>
                <option value="decal-100x75">Khổ Decal nhiệt 100 x 75 mm (Máy in mã vạch)</option>
                <option value="decal-100x150">Khổ Decal nhiệt 100 x 150 mm</option>
              </select>
            </div>

            <div class="mb-2">
              <label class="form-label small fw-semibold mb-1">Loại mã hiển thị:</label>
              <div class="d-flex gap-3">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" id="chkShowQR" checked>
                  <label class="form-check-label small" for="chkShowQR">Mã QR</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" id="chkShowBarcode" checked>
                  <label class="form-check-label small" for="chkShowBarcode">Barcode 128</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" id="chkShowLogo" checked>
                  <label class="form-check-label small" for="chkShowLogo">Logo DDC</label>
                </div>
              </div>
            </div>
          </div>

          <!-- Column 2: Rack Range Selector -->
          <div class="col-lg-8 col-md-12">
            <div class="d-flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
              <h6 class="fw-bold text-dark mb-0"><i class="bi bi-check2-square text-success"></i> 2. Chọn vị trí kệ cần in (<span id="selectedCountBadge">31</span> tem được chọn)</h6>
              <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-primary" id="btnSelectAll">Chọn tất cả</button>
                <button type="button" class="btn btn-outline-secondary" id="btnSelectRowA">Dãy A (14)</button>
                <button type="button" class="btn btn-outline-secondary" id="btnSelectRowB">Dãy B (14)</button>
                <button type="button" class="btn btn-outline-secondary" id="btnSelectGrating">Grating</button>
                <button type="button" class="btn btn-outline-danger" id="btnUnselectAll">Bỏ chọn</button>
              </div>
            </div>

            <!-- Rack Checkbox Container -->
            <div class="rack-checkbox-matrix p-2 border rounded bg-light" id="rackMatrixContainer">
              <!-- Dynamically populated by JS -->
            </div>

            <!-- Custom Location Input -->
            <div class="mt-2 row g-2 align-items-center">
              <div class="col-auto">
                <label class="small fw-semibold">Thêm vị trí khác:</label>
              </div>
              <div class="col">
                <input type="text" id="customRacksInput" class="form-control form-control-sm" placeholder="VD: C01, C02, BAI-01 (ngăn cách bằng dấu phẩy)">
              </div>
              <div class="col-auto">
                <button type="button" class="btn btn-sm btn-outline-success" id="btnAddCustomRacks">+ Thêm</button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Live Preview Status Bar (Screen Only) -->
    <div class="d-flex align-items-center justify-content-between bg-white px-3 py-2 border rounded mb-3 no-print shadow-sm">
      <div class="small text-muted">
        <i class="bi bi-info-circle text-primary"></i> Đang hiển thị bản xem trước: <strong id="previewSummaryText">31 tem (Khổ A4 4 tem/trang)</strong>
      </div>
      <div>
        <button class="btn btn-sm btn-outline-primary" id="btnScrollToTop"><i class="bi bi-arrow-up"></i> Về đầu trang</button>
      </div>
    </div>

    <!-- Print Template Output Grid -->
    <div id="labelsContainer" class="labels-container layout-a4-grid-4">
      <!-- Label cards rendered here dynamically -->
    </div>

  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- QRCode.js (High resolution canvas/SVG QR generator) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- JsBarcode (Code 128 generator) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <!-- Core Services -->
  <script src="/assets/js/core/qr-scanner-service.js"></script>

  <!-- Sidebar JS -->
  <script src="/assets/js/components/sidebar.js"></script>
  <script src="/assets/js/home.js"></script>

  <!-- Print Label Page JS -->
  <script src="/assets/js/in-tem-vitri.js"></script>

</body>

</html>
