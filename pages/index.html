<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!-- Remix Icons -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">

   <!-- CSS -->
   <link rel="stylesheet" href="/assets/css/dang_nhap.css">
   <link rel="stylesheet" href="/assets/css/mobile-responsive.css">

   <!-- PWA Manifest & Icons -->
   <link rel="manifest" href="/manifest.json">
   <meta name="theme-color" content="#1e293b">
   <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
   <script src="/assets/js/pwa-register.js" defer></script>

   <title>Kho Phôi cuộn - DDC</title>

   <!-- Logo hiển thị trên tab -->
   <link rel="icon" type="image/png" href="/assets/img/Logo-DDC.png">

</head>

<body>
   <div class="login">
      <img src="/assets/img/login-bg.png" alt="background" class="login__bg">

      <form id="loginForm" class="login__form">
         <h1 class="login__title">Login</h1>

         <div class="login__inputs">
            <div class="login__box">
               <input type="text" name="username" placeholder="Username" required class="login__input"
                  autocomplete="username">
               <i class="ri-user-fill"></i>
            </div>

            <div class="login__box">
               <input type="password" name="password" placeholder="Password" required class="login__input"
                  autocomplete="current-password">
               <i class="ri-lock-2-fill"></i>
            </div>
         </div>

         <div class="login__check">
            <div class="login__check-group">
               <div class="login__check-box">
                  <input type="checkbox" class="login__check-input" id="user-check" name="remember">
                  <label for="user-check" class="login__check-label">Remember me</label>
               </div>
            </div>
         </div>

         <!-- Thông báo lỗi -->
         <div class="login__error" id="errorMessage"></div>

         <button type="submit" class="login__button">Login</button>
      </form>
   </div>

   <!-- OTP Verification Modal -->
   <div id="otpModal" class="otp__modal">
      <div class="otp__card">
         <h2 class="otp__title"><i class="ri-shield-keyhole-line"></i> Xác Thực OTP</h2>
         <p class="otp__subtitle">Mã xác nhận 6 chữ số đã được gửi tới email:<br><strong id="otpTargetEmail">thaibao06061997@gmail.com</strong></p>
         
         <div class="otp__inputs" id="otpInputGroup">
            <input type="text" maxlength="1" class="otp__field" data-index="0" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="otp__field" data-index="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="otp__field" data-index="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="otp__field" data-index="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="otp__field" data-index="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="otp__field" data-index="5" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
         </div>

         <div class="otp__error" id="otpError"></div>

         <div class="otp__timer-box">
            <span>Gửi lại mã sau: <strong id="otpTimer">60</strong>s</span>
            <button type="button" id="resendOtpBtn" class="otp__resend-btn" disabled>Gửi lại mã</button>
         </div>

         <div class="otp__actions">
            <button type="button" id="cancelOtpBtn" class="otp__btn otp__btn--cancel">Hủy</button>
            <button type="button" id="verifyOtpBtn" class="otp__btn otp__btn--submit">Xác nhận</button>
         </div>
      </div>
   </div>

   <!-- Demo Toast Notification -->
   <div id="demoOtpToast" class="otp__toast">
      <div class="otp__toast-header"><i class="ri-mail-send-fill"></i> [DEMO] MÃ OTP ĐÃ GỬI TỚI EMAIL</div>
      <div class="otp__toast-body">Mã OTP đăng nhập của bạn là: <strong id="demoOtpCode">123456</strong></div>
   </div>

   <!-- EmailJS SDK -->
   <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
   <!-- Supabase SDK & Config -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
   <script src="/assets/js/supabase-config.js"></script>
   <!-- JavaScript -->
   <script src="/assets/js/update-checker.js" defer></script>
   <script src="/assets/js/dang_nhap.js"></script>
</body>

</html>
